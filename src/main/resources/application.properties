spring.application.name=mfa-service
server.port=8087
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${digital-bank.service.runtime-profile:${spring.profiles.active:default}}
logging.structured.json.rename.service=ecs_service
logging.structured.json.rename.correlation_id=ecs_correlation_id
logging.structured.json.rename.traceId=ecs_trace_id
logging.structured.json.rename.spanId=ecs_span_id
logging.structured.json.rename.flat_service=service
logging.structured.json.rename.flat_correlation_id=correlation_id
logging.structured.json.rename.flat_trace_id=trace_id
logging.structured.json.rename.flat_span_id=span_id
logging.structured.json.customizer=com.digitalbank.mfaservice.FlatStructuredLoggingJsonMembersCustomizer

management.tracing.export.zipkin.enabled=${ZIPKIN_TRACING_ENABLED:false}

spring.datasource.url=${MFA_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mfa_service}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.enabled=false

mfa.challenge.ttl=PT5M
mfa.challenge.max-attempts=5
mfa.totp.encryption-key=${MFA_TOTP_ENCRYPTION_KEY:}

mfa.assurance.publisher.enabled=${MFA_ASSURANCE_PUBLISHER_ENABLED:false}
mfa.assurance.publisher.batch-size=${MFA_ASSURANCE_PUBLISHER_BATCH_SIZE:100}
mfa.assurance.publisher.poll-interval-ms=${MFA_ASSURANCE_PUBLISHER_POLL_INTERVAL_MS:5000}
spring.kafka.bootstrap-servers=${MFA_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
