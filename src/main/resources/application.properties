spring.application.name=mfa-service
server.port=8087
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.datasource.url=${MFA_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mfa_service}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.enabled=false

mfa.challenge.ttl=PT5M
mfa.challenge.max-attempts=5
mfa.totp.encryption-key=${MFA_TOTP_ENCRYPTION_KEY:}
